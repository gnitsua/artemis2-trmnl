<style>
  .map { position: relative; }
  .map-body { position: absolute; left: 50%; transform: translateX(-50%); }
  .map-body-label { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .map-earth { bottom: 50px; }
  .map-earth-label { top: -18px; }
  .map-moon { top: 40px; }
  .map-moon-label { bottom: -18px; }
  .map-craft { transform: translate(-50%, -50%); }
  .map-craft-label { position: absolute; left: 20px; top: -4px; white-space: nowrap; }
  .circle { border-radius: 9999px; }
  .craft-dot { border: 3px solid black; }
</style>

<div class="layout layout--row gap--medium">
  <!-- LEFT: 2D trajectory map -->
  <div class="map w--[420px] h--full">
    <!-- Earth (bottom-center) -->
    <div class="map-body map-earth">
      <div class="circle bg--black w--16 h--16"></div>
      <span class="label label--small map-body-label map-earth-label">Earth</span>
    </div>

    <!-- Moon (top-center) -->
    <div class="map-body map-moon">
      <div class="circle bg--black w--8 h--8"></div>
      <span class="label label--small map-body-label map-moon-label">Moon</span>
    </div>

    <!-- Spacecraft -->
    <div class="map-craft" style="position: absolute; left: {{ craft_x_pct }}%; top: {{ craft_y_pct }}%;">
      <div class="circle craft-dot bg--white w--3 h--3"></div>
      <span class="label label--small map-craft-label">Orion</span>
    </div>
  </div>

  <!-- RIGHT: Mission stats -->
  <div class="flex flex--col flex--center-y gap--medium grow">
    <span class="title title--large">Artemis II</span>

    <div class="flex flex--col gap--small">
      <span class="label label--gray">Distance from Earth</span>
      <span class="value value--large">{{ distance_earth_km }}</span>
      <span class="label label--small">km</span>
    </div>

    <div class="divider"></div>

    <div class="flex flex--col gap--small">
      <span class="label label--gray">Distance from Moon</span>
      <span class="value value--large">{{ distance_moon_km }}</span>
      <span class="label label--small">km</span>
    </div>

    <span class="label label--small label--gray">{{ updated_at }}</span>
  </div>
</div>
