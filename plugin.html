<div class="layout layout--row gap--medium">
  <!-- LEFT: 2D trajectory map -->
  <div class="w--[420px] h--full" style="position: relative;">
    <!-- Earth (bottom-center) -->
    <div style="position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);">
      <div class="w--16 h--16 rounded--full bg--black"></div>
      <span class="label label--small" style="position: absolute; top: -18px; left: 50%; transform: translateX(-50%); white-space: nowrap;">Earth</span>
    </div>

    <!-- Moon (top-center) -->
    <div style="position: absolute; top: 40px; left: 50%; transform: translateX(-50%);">
      <div class="w--8 h--8 rounded--full bg--black"></div>
      <span class="label label--small" style="position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); white-space: nowrap;">Moon</span>
    </div>

    <!-- Spacecraft -->
    <div style="position: absolute; left: {{ craft_x_pct }}%; top: {{ craft_y_pct }}%; transform: translate(-50%, -50%);">
      <div class="w--3 h--3 rounded--full bg--white border--h-1"></div>
      <span class="label label--small" style="position: absolute; left: 20px; top: -4px; white-space: nowrap;">Orion</span>
    </div>
  </div>

  <!-- RIGHT: Mission stats -->
  <div class="flex flex--col flex--center-y gap--medium grow">
    <span class="title title--large">Artemis II</span>

    <div class="flex flex--col gap--small">
      <span class="label label--gray">Distance from Earth</span>
      <span class="value value--large">{{ distance_earth_km }}</span>
      <span class="label label--small">km</span>
    </div>

    <div class="divider"></div>

    <div class="flex flex--col gap--small">
      <span class="label label--gray">Distance from Moon</span>
      <span class="value value--large">{{ distance_moon_km }}</span>
      <span class="label label--small">km</span>
    </div>

    <span class="label label--small label--gray">{{ updated_at }}</span>
  </div>
</div>
