<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Artemis II - Rendering Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 16px;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      color: white;
      font-size: 14px;
      width: 800px;
    }
    .controls button {
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #666;
      background: #333;
      color: white;
      border-radius: 4px;
    }
    .controls button:hover { background: #444; }
    .controls button.active { background: #0066cc; border-color: #0088ff; }
    .controls input[type=range] { flex: 1; }
    .controls .info { min-width: 220px; text-align: right; font-variant-numeric: tabular-nums; }
    .speed-controls { display: flex; gap: 4px; }

    /* Screen (matches TRMNL 800x480) */
    .screen {
      background: white;
      width: 800px;
      height: 480px;
      display: flex;
      flex-direction: row;
      padding: 24px;
      gap: 24px;
      border-radius: 4px;
    }

    /* Map */
    .map {
      position: relative;
      width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
    }
    .body-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .body-label { font-size: 13px; color: #666; }
    .circle { border-radius: 9999px; background: black; }
    .earth { width: 64px; height: 64px; }
    .moon { width: 32px; height: 32px; }

    /* Capsule */
    .map-craft {
      position: absolute;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .capsule-wrap {
      filter:
        drop-shadow(1px 0 0 white) drop-shadow(-1px 0 0 white)
        drop-shadow(0 1px 0 white) drop-shadow(0 -1px 0 white)
        drop-shadow(1px 1px 0 white) drop-shadow(-1px 1px 0 white)
        drop-shadow(1px -1px 0 white) drop-shadow(-1px -1px 0 white);
    }
    .capsule {
      width: 16px;
      height: 16px;
      background: black;
      clip-path: polygon(0% 0%, 100% 0%, 75% 100%, 25% 100%);
    }

    /* Trail */
    .trail-dot {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 9999px;
      background: rgba(0,0,0,0.15);
      transform: translate(-50%, -50%);
    }

    /* Stats */
    .stats {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }
    .stats h1 { font-size: 30px; font-weight: 700; }
    .stat-group { display: flex; flex-direction: column; gap: 4px; }
    .stat-label { font-size: 13px; color: #888; }
    .stat-value { font-size: 42px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-unit { font-size: 13px; color: #666; }
    .divider { height: 1px; background: #ddd; }
    .updated { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="play-btn" onclick="togglePlay()">Play</button>
    <div class="speed-controls">
      <button class="speed-btn" data-speed="1">1x</button>
      <button class="speed-btn active" data-speed="5">5x</button>
      <button class="speed-btn" data-speed="20">20x</button>
      <button class="speed-btn" data-speed="60">60x</button>
    </div>
    <input type="range" id="scrubber" min="0" max="0" value="0" oninput="scrub(this.value)">
    <div class="info">
      <span id="frame-info">Frame 0 / 0</span> &mdash;
      <span id="hours-info">T+0h</span>
    </div>
  </div>

  <div class="screen">
    <div class="map" id="map">
      <div class="body-group">
        <div class="circle moon"></div>
        <span class="body-label">Moon</span>
      </div>

      <div class="map-craft" id="spacecraft">
        <div class="capsule-wrap" id="capsule-wrap"><div class="capsule"></div></div>
      </div>

      <div class="body-group">
        <span class="body-label">Earth</span>
        <div class="circle earth"></div>
      </div>
    </div>

    <div class="stats">
      <h1>Artemis II</h1>
      <div class="stat-group">
        <span class="stat-label">Distance from Earth</span>
        <span class="stat-value" id="dist-earth">—</span>
        <span class="stat-unit">km</span>
      </div>
      <div class="divider"></div>
      <div class="stat-group">
        <span class="stat-label">Distance from Moon</span>
        <span class="stat-value" id="dist-moon">—</span>
        <span class="stat-unit">km</span>
      </div>
      <span class="updated" id="elapsed"></span>
    </div>
  </div>

  <script src="test_frames.js"></script>
  <script>
    let frames = [];
    let currentFrame = 0;
    let playing = false;
    let interval = null;
    let speed = 5;
    const trailDots = [];
    const MAX_TRAIL = 80;

    function loadFrames() {
      frames = TEST_FRAMES;
      document.getElementById("scrubber").max = frames.length - 1;
      render(0);
    }

    function render(idx) {
      currentFrame = idx;
      const f = frames[idx];

      const sc = document.getElementById("spacecraft");
      sc.style.left = f.craft_x_pct + "%";
      sc.style.top = f.craft_y_pct + "%";
      document.getElementById("capsule-wrap").style.rotate = f.craft_heading_deg + "deg";

      document.getElementById("dist-earth").textContent = f.distance_earth_km;
      document.getElementById("dist-moon").textContent = f.distance_moon_km;
      document.getElementById("elapsed").textContent = "T+" + f.hours_elapsed + "h";
      document.getElementById("scrubber").value = idx;
      document.getElementById("frame-info").textContent = `Frame ${idx} / ${frames.length - 1}`;
      document.getElementById("hours-info").textContent = `T+${f.hours_elapsed}h`;

      // Trail
      const map = document.getElementById("map");
      const dot = document.createElement("div");
      dot.className = "trail-dot";
      dot.style.left = f.craft_x_pct + "%";
      dot.style.top = f.craft_y_pct + "%";
      map.appendChild(dot);
      trailDots.push(dot);
      if (trailDots.length > MAX_TRAIL) {
        trailDots.shift().remove();
      }
    }

    function clearTrail() {
      trailDots.forEach(d => d.remove());
      trailDots.length = 0;
    }

    function togglePlay() {
      playing = !playing;
      document.getElementById("play-btn").textContent = playing ? "Pause" : "Play";
      if (playing) {
        interval = setInterval(() => {
          if (currentFrame < frames.length - 1) {
            render(currentFrame + 1);
          } else {
            togglePlay();
          }
        }, 1000 / speed);
      } else {
        clearInterval(interval);
      }
    }

    function scrub(val) {
      clearTrail();
      render(parseInt(val));
    }

    document.querySelectorAll(".speed-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        speed = parseInt(btn.dataset.speed);
        if (playing) {
          clearInterval(interval);
          interval = setInterval(() => {
            if (currentFrame < frames.length - 1) {
              render(currentFrame + 1);
            } else {
              togglePlay();
            }
          }, 1000 / speed);
        }
      });
    });

    loadFrames();
  </script>
</body>
</html>
