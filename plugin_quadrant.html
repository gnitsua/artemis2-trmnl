<style>
  .map { position: relative; height: 140px; width: 122px; margin: 0 auto; }
  .map-body { position: absolute; left: 50%; transform: translate(-50%, -50%); }
  .map-earth { bottom: 5px; left: 50%; transform: translateX(-50%); }
  .map-craft { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
  .trail-dot { position: absolute; width: 2px; height: 2px; border-radius: 9999px; background: black; transform: translate(-50%, -50%); opacity: 0.2; z-index: 2; }
  .circle { border-radius: 9999px; }
  .capsule-wrap {
    filter:
      drop-shadow(3px 0 0 white) drop-shadow(-3px 0 0 white)
      drop-shadow(0 3px 0 white) drop-shadow(0 -3px 0 white)
      drop-shadow(2px 2px 0 white) drop-shadow(-2px 2px 0 white)
      drop-shadow(2px -2px 0 white) drop-shadow(-2px -2px 0 white);
  }
  .capsule {
    width: 10px;
    height: 10px;
    background: black;
    clip-path: polygon(0% 0%, 100% 0%, 75% 100%, 25% 100%);
  }
</style>

<div class="layout layout--col layout--center-x gap--xsmall">
  <!-- Map area -->
  <div class="map w--full">
    <!-- Moon -->
    <div class="map-body" style="top: {{ moon_y_pct }}%;">
      <div class="circle bg--black w--3.5 h--3.5"></div>
    </div>

    <!-- Trail -->
    {% for point in trail %}
      <div class="trail-dot" style="left: {{ point.x }}%; top: {{ point.y }}%;"></div>
    {% endfor %}
    <div class="trail-dot" style="left: {{ craft_x_pct }}%; top: {{ craft_y_pct }}%;"></div>

    <!-- Spacecraft -->
    <div class="map-craft" style="left: {{ craft_x_pct }}%; top: {{ craft_y_pct }}%;">
      <div class="capsule-wrap" style="rotate: {{ craft_heading_deg }}deg;"><div class="capsule"></div></div>
    </div>

    <!-- Earth -->
    <div class="map-earth" style="position: absolute;">
      <div class="circle bg--black w--7 h--7"></div>
    </div>
  </div>

  <!-- Stats -->
  <span class="title title--small">Artemis II</span>
  <div class="flex flex--row flex--center-x gap--medium">
    <div class="flex flex--col flex--center-x gap--none">
      <span class="label label--small label--gray">Earth</span>
      <span class="value value--small">{{ distance_earth_km }}</span>
    </div>
    <div class="flex flex--col flex--center-x gap--none">
      <span class="label label--small label--gray">Moon</span>
      <span class="value value--small">{{ distance_moon_km }}</span>
    </div>
  </div>
</div>
