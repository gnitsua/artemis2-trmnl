<style>
  .map { position: relative; }
  .map-craft { position: absolute; transform: translate(-50%, -50%); }
  .circle { border-radius: 9999px; }
  .craft-dot { border: 2px solid black; }
</style>

<div class="layout layout--col layout--center-x gap--xsmall">
  <!-- Map area -->
  <div class="map flex flex--col flex--center-x flex--between w--full h--[140px]">
    <!-- Moon (top) -->
    <div class="circle bg--black w--3.5 h--3.5 mt--xsmall"></div>

    <!-- Spacecraft (absolute, only element that needs it) -->
    <div class="map-craft" style="left: {{ craft_x_pct }}%; top: {{ craft_y_pct }}%;">
      <div class="circle craft-dot bg--white w--2 h--2"></div>
    </div>

    <!-- Earth (bottom) -->
    <div class="circle bg--black w--7 h--7 mb--xsmall"></div>
  </div>

  <!-- Stats -->
  <span class="title title--small">Artemis II</span>
  <div class="flex flex--row flex--center-x gap--medium">
    <div class="flex flex--col flex--center-x gap--none">
      <span class="label label--small label--gray">Earth</span>
      <span class="value value--small">{{ distance_earth_km }}</span>
    </div>
    <div class="flex flex--col flex--center-x gap--none">
      <span class="label label--small label--gray">Moon</span>
      <span class="value value--small">{{ distance_moon_km }}</span>
    </div>
  </div>
</div>
