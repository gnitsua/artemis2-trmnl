<style>
  .map { position: relative; height: 280px; }
  .map-craft { position: absolute; transform: translate(-50%, -50%); }
  .map-craft-label { position: absolute; left: 16px; top: -4px; white-space: nowrap; }
  .circle { border-radius: 9999px; }
  .craft-dot { border: 2px solid black; }
</style>

<div class="layout layout--col layout--center-x gap--small">
  <!-- Map area -->
  <div class="map flex flex--col flex--center-x flex--between w--full py--small">
    <!-- Moon (top) -->
    <div class="flex flex--col flex--center-x gap--xsmall">
      <div class="circle bg--black w--5 h--5"></div>
      <span class="label label--small">Moon</span>
    </div>

    <!-- Spacecraft -->
    <div class="map-craft" style="left: {{ craft_x_pct }}%; top: {{ craft_y_pct }}%;">
      <div class="circle craft-dot bg--white w--2.5 h--2.5"></div>
      <span class="label label--small map-craft-label">Orion</span>
    </div>

    <!-- Earth (bottom) -->
    <div class="flex flex--col flex--center-x gap--xsmall">
      <span class="label label--small">Earth</span>
      <div class="circle bg--black w--10 h--10"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="flex flex--row flex--center-x gap--large">
    <div class="flex flex--col flex--center-x gap--xsmall">
      <span class="label label--small label--gray">Earth</span>
      <span class="value">{{ distance_earth_km }}</span>
      <span class="label label--small">km</span>
    </div>
    <div class="flex flex--col flex--center-x gap--xsmall">
      <span class="label label--small label--gray">Moon</span>
      <span class="value">{{ distance_moon_km }}</span>
      <span class="label label--small">km</span>
    </div>
  </div>

  <span class="label label--small label--gray">{{ updated_at }}</span>
</div>
